[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options-bt"
version = "1.1"
description = "Options backtesting engine"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gspread",
    "requests",
    "websockets",
    "numpy",
    "pandas",
    "polars",
    "duckdb",
    "pyarrow",
    "ipykernel",
    "matplotlib",
    "pytest",
    "oauth2client==4.1.3",
    "python-dotenv",
    "seaborn",
    "maturin",
    "ib_insync",
    "ib_tools @ file:///home/dev/projects/fin-tools/ib-tools",
]

[project.scripts]
tsmom = "options_bt.live.run_tsmom_rebalance:main"
naked = "options_bt.strats.naked_futures:main"

[tool.setuptools.packages.find]
include = ["options_bt*"]

# options_engine is a separate, not-yet-wired-up Rust extension crate (no
# Python code in this project imports it). It isn't part of this package's
# build — build/install it independently if/when that work picks back up:
#   maturin build --manifest-path options_engine/Cargo.toml
