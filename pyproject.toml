[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "derivatives-bt-engine"
version = "1.1"
description = "Backtesting engine for futures and options"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gspread",
    "requests",
    "websockets",
    "numpy",
    "pandas",
    "polars",
    "duckdb",
    "pyarrow",
    "ipykernel",
    "matplotlib",
    "pytest",
    "oauth2client==4.1.3",
    "python-dotenv",
    "seaborn",
    "maturin",
    "ib_insync",
    "scipy",
    "pyportfolioopt",
    "ib_tools @ file:///Users/liefe/Projects/personal/fin/fin-tools/ib-tools"
]

[project.scripts]
tsmom = "derivatives_bt_engine.live.run_tsmom_rebalance:main"
naked = "derivatives_bt_engine.strats.naked_futures:main"
tsmom-bt = "derivatives_bt_engine.strats.tsmom_backtest:main"

[tool.setuptools.packages.find]
include = ["derivatives_bt_engine*"]

# options_engine is a separate, not-yet-wired-up Rust extension crate (no
# Python code in this project imports it). It isn't part of this package's
# build — build/install it independently if/when that work picks back up:
#   maturin build --manifest-path options_engine/Cargo.toml
