[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "options-bt"
version = "1.1"
description = "Options backtesting engine"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
packages = ["options_bt"]
dependencies = [
    "gspread",
    "requests",
    "websockets",
    "numpy",
    "pandas",
    "polars",
    "duckdb",
    "pyarrow",
    "ipykernel",
    "matplotlib",
    "pytest",
    "oauth2client==4.1.3",
    "python-dotenv",
    "seaborn",
    "maturin",
    "ib_insync",
    "ib_tools @ file:///home/dev/projects/fin-tools/ib-tools",
]

[project.scripts]
tsmom = "options_bt.live.run_tsmom_rebalance:main"

[tool.maturin]
manifest-path = "options_engine/Cargo.toml"
module-name = "options_engine"