[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "derivatives-bt-engine"
version = "1.1"
description = "Backtesting engine for futures and options"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gspread",
    "requests",
    "websockets",
    "numpy",
    "pandas",
    "polars",
    "duckdb",
    "pyarrow",
    "ipykernel",
    "matplotlib",
    "pytest",
    "oauth2client==4.1.3",
    "python-dotenv",
    "seaborn",
    "hvplot",
    "maturin",
    "ib_insync",
    "scipy",
    "pyportfolioopt",
    "ib_tools @ file:///home/dev/projects/fin-tools/ib-tools"
]

[project.scripts]
rebal = "derivatives_bt_engine.live.run_tsmom_rebalance:main"
naked = "derivatives_bt_engine.strats.naked_futures:main"
tsmom = "derivatives_bt_engine.strats.tsmom:main"
tsmom-grid-search = "derivatives_bt_engine.strats.tsmom_grid_search:main"
bear-call = "derivatives_bt_engine.strats.bear_call:main"
bull-put = "derivatives_bt_engine.strats.bull_put:main"
bull-put-search = "derivatives_bt_engine.strats.bull_put_param_search:main"
iron-condor = "derivatives_bt_engine.strats.iron_condor:main"
iron-condor-search = "derivatives_bt_engine.strats.iron_condor_param_search:main"
long-call = "derivatives_bt_engine.strats.long_call:main"
long-futures = "derivatives_bt_engine.strats.long_futures:main"
window-naked = "derivatives_bt_engine.strats.window_scheme_naked_futures:main"
window-bull-put = "derivatives_bt_engine.strats.window_scheme_bull_put:main"
window-iron-condor = "derivatives_bt_engine.strats.window_scheme_iron_condor:main"
tsmom-vol-parity = "derivatives_bt_engine.strats.tsmom_binary_vol_parity_backtest:main"
tsmom-vol-parity-windows = "derivatives_bt_engine.strats.tsmom_vol_parity_window_scheme:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["derivatives_bt_engine*"]

# options_engine is a separate, not-yet-wired-up Rust extension crate (no
# Python code in this project imports it). It isn't part of this package's
# build — build/install it independently if/when that work picks back up:
#   maturin build --manifest-path options_engine/Cargo.toml
